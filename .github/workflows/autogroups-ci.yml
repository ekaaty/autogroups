name: Autogroups build & release
on:
  push:
    tags:
      - "v*"

jobs:
  autogroups-ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout local
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build official sdist and wheel
        run: uv build

      - name: Upload artifacts for Release
        uses: actions/upload-artifact@v5
        with:
          name: python-artifacts
          path: dist/*
          retention-days: 1

  release:
    needs: autogroups-ci
    uses: ./.github/workflows/release.yml
