[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autogroups"
version = "0.3.0"
authors = [
  { name="Christian Tosta" },
]
description = "A declarative system group synchronization engine for Linux workstations"
readme = "README.md"
requires-python = ">=3.6"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PyYAML",
]

[project.scripts]
autogroups = "autogroups.cli:main"

[tool.setuptools]
packages = ["autogroups", "autogroups.backends"]
