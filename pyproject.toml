[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autogroups"
version = "0.1.0"
authors = [
  { name="Christian Tosta" },
]
description = "A declarative system group synchronization engine for Linux workstations"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "GPLv2-or-later"}
dependencies = [
    "PyYAML",
]

[project.scripts]
autogroups = "autogroups.cli:main"

[tool.setuptools]
packages = ["autogroups", "autogroups.backends"]
